apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    k8s.v1.cni.cncf.io/networks: macvlan-conf
  name: kping-deployment-multus
  labels:
    app: kping-server-multus  
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kping-server-multus
  template:
    metadata:
      labels:
        app: kping-server-multus
    spec:
      containers:
      - name: kping-server-multus
        image: kayrosuno/kping:0.3.2
        ports:
        - containerPort: 25450