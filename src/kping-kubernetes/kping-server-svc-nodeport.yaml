apiVersion: v1
kind: Service
metadata:
  name: kping-svc-nodeport
spec:
  type: NodePort
  ports:
  - name: kping-quic-udp
    port: 25450  
    nodePort: 30450
    targetPort: 25450
    protocol: UDP
  - name: kping-tcp
    port: 25450
    nodePort: 30450
    targetPort: 25450
    protocol: TCP
  selector:
    app: kping-server
