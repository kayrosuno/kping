apiVersion: apps/v1
kind: Deployment
metadata:
  name: kping-server-deployment
  namespace: kping
  labels:
    app: kping-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kping-server
  template:
    metadata:
      labels:
        app: kping-server
    spec:
      containers:
      - name: kping-server
        image: kayrosuno/kping:latest
        ports:
        - containerPort: 25450
          protocol: TCP
          name: "tcp"
        - containerPort: 25450
          protocol: UDP
          name: "quic-udp"
        - containerPort: 25451
          protocol: UDP
          name: "udp only"
        - containerPort: 25450
          protocol: SCTP
          name: "sctp"
        imagePullPolicy: Always